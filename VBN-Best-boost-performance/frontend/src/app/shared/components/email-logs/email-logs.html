<div class="p-8">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-orange-600">Email Delivery Logs</h2>
    <p-button icon="pi pi-refresh" [rounded]="true" [text]="true" (onClick)="loadLogs()" pTooltip="Refresh"></p-button>
  </div>

  <div class="bg-white shadow-lg rounded-xl p-6">
    <p-table [value]="logs" [paginator]="true" [rows]="15" [loading]="loading" responsiveLayout="scroll"
      styleClass="p-datatable-striped w-full">

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="timestamp">Date & Time <p-sortIcon field="timestamp" /></th>
          <th pSortableColumn="subject">Subject <p-sortIcon field="subject" /></th>
          <th>Recipient(s)</th>
          <th pSortableColumn="status">Status <p-sortIcon field="status" /></th>
          <th>Details</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-log>
        <tr>
          <td class="text-sm whitespace-nowrap">{{ log.timestamp | date:'MMM d, y, h:mm a' }}</td>
          <td class="font-medium text-slate-800">{{ log.subject }}</td>
          <td class="text-sm text-slate-500 max-w-xs truncate" [pTooltip]="log.recipient">{{ log.recipient }}</td>
          <td>
            <span class="px-3 py-1 rounded-full text-xs font-bold tracking-wide" [ngClass]="getBadgeClass(log.status)">
              {{ log.status }}
            </span>
          </td>
          <td class="text-xs text-red-500 max-w-xs truncate" [pTooltip]="log.error_message">
            {{ log.error_message || '-' }}
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="empty">
        <tr>
          <td colspan="5" class="text-center text-slate-400 py-10">No email logs found.</td>
        </tr>
      </ng-template>

    </p-table>
  </div>
</div>
