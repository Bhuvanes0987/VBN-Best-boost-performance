<p-toast position="top-right" />

<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-10 border-2 border-orange-500">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800 mb-2">Forgot Password</h2>
      <p class="text-gray-500 text-sm">Enter your email to receive a reset link</p>
    </div>

    <div *ngIf="sent" class="text-center py-6">
      <i class="pi pi-check-circle text-green-500 text-5xl mb-4 block"></i>
      <p class="text-gray-700 font-medium mb-2">Reset link sent!</p>
      <p class="text-gray-500 text-sm mb-6">Check your email and follow the instructions.</p>
      <a routerLink="/login" class="text-orange-500 font-semibold hover:underline">
        Back to Login
      </a>
    </div>

    <div *ngIf="!sent" class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Email</label>
        <input pInputText [(ngModel)]="email"
          placeholder="Enter your registered email"
          class="w-full p-4 rounded-xl border border-gray-300"/>
      </div>

      <button (click)="submit()"
        [disabled]="loading"
        class="w-full py-4 bg-gradient-to-r from-orange-500 to-orange-600
               hover:from-orange-600 hover:to-orange-700
               text-white font-bold text-lg rounded-xl shadow-lg
               transition transform hover:scale-[1.02] active:scale-95 disabled:opacity-60">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>

      <p class="text-center text-gray-400 text-sm">
        Remember your password?
        <a routerLink="/login" class="text-orange-400 hover:text-orange-300 ml-1">Login</a>
      </p>
    </div>

  </div>
</div>
