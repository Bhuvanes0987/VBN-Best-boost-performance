<p-toast position="top-right" />
<p-confirmpopup />

<div class="min-h-screen bg-slate-50">
  <div class="h-32 bg-gradient-to-r from-orange-600 to-orange-400 w-full absolute top-0 left-0"></div>

  <div class="relative max-w-6xl mx-auto p-4">

    <h1 class="text-3xl font-extrabold text-white mb-8">Role Management</h1>

    <div class="bg-white shadow-lg rounded-xl p-6 mb-8">

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold text-gray-700">Role Name *</label>
          <input pInputText [(ngModel)]="roleName" placeholder="e.g. Principal, Teacher"/>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold text-gray-700">Description</label>
          <input pInputText [(ngModel)]="description" placeholder="Brief description"/>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 mt-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold text-gray-700">School (optional)</label>
          <p-select [options]="schools" [(ngModel)]="selectedSchool"
            optionLabel="name" optionValue="id"
            placeholder="All Schools (Global)" styleClass="w-full">
          </p-select>
          <small class="text-gray-400 text-xs">Leave empty for global role</small>
        </div>

      </div>

      <div class="mt-4">
        <label class="text-sm font-semibold text-gray-700 block mb-2">Permissions</label>
        <p-multiSelect
          [options]="permissions"
          [(ngModel)]="selectedPermissions"
          optionLabel="name"
          placeholder="Select Permissions"
          styleClass="w-full">
        </p-multiSelect>
      </div>

      <div class="flex gap-3 mt-6">
        <button pButton *ngIf="!editingRoleId"
          label="Create Role"
          class="bg-orange-500 border-none"
          (click)="createRole()">
        </button>

        <button pButton *ngIf="editingRoleId"
          label="Update Role"
          class="bg-green-500 border-none"
          (click)="updateRole()">
        </button>

        <button pButton *ngIf="editingRoleId"
          label="Cancel"
          class="p-button-text"
          (click)="resetForm()">
        </button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow overflow-hidden">
      <p-table [value]="roles" responsiveLayout="scroll" styleClass="p-datatable-striped w-full">

        <ng-template pTemplate="header">
          <tr>
            <th>Role Name</th>
            <th>Type</th>
            <th>School</th>
            <th>Description</th>
            <th>Permissions</th>
            <th class="text-center">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-role>
          <tr>
            <td class="font-medium">{{ role.name }}</td>
            <td>
              <span class="px-2 py-1 rounded text-xs font-semibold capitalize"
                [ngClass]="{
                  'bg-red-100 text-red-600':  role.role_type === 'principal',
                  'bg-blue-100 text-blue-600': role.role_type === 'teacher',
                  'bg-gray-100 text-gray-600': role.role_type === 'custom'
                }">
                {{ role.role_type || 'custom' }}
              </span>
            </td>
            <td>
              <span class="bg-purple-100 text-purple-700 px-2 py-1 rounded text-xs">
                {{ getSchoolName(role.school_id) }}
              </span>
            </td>
            <td>{{ role.description || '-' }}</td>
            <td>
              <span *ngIf="role.permissions?.length; else noPerm">
                <span *ngFor="let p of role.permissions; let last = last">
                  {{ p.name }}<span *ngIf="!last">, </span>
                </span>
              </span>
              <ng-template #noPerm>-</ng-template>
            </td>
            <td class="text-center">
              <div class="flex justify-center gap-2">
                <button pButton icon="pi pi-pencil"
                  class="p-button-warning p-button-sm"
                  pTooltip="Edit"
                  (click)="editRole(role)">
                </button>

                <button pButton icon="pi pi-trash"
                  class="p-button-danger p-button-sm"
                  pTooltip="Delete"
                  (click)="confirmDelete($event, role.id)">
                </button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="empty">
          <tr>
            <td colspan="6" class="text-center text-gray-400 py-8">No custom roles found</td>
          </tr>
        </ng-template>

      </p-table>
    </div>
  </div>
</div>
