<p-toast position="top-right" />

<div class="min-h-screen flex items-center justify-center bg-gray-100 py-10">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <h2 class="text-center text-4xl font-bold text-orange-500 mb-2">Create Account</h2>
    <p class="text-center text-gray-500 text-sm mb-8">Fill in your details to register</p>

    <form class="flex flex-col gap-4" (ngSubmit)="signup()">

      <div class="flex flex-col gap-1">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Full Name *</label>
        <input pInputText name="fullName" [(ngModel)]="fullName" placeholder="Enter your full name"
          class="w-full p-3 border rounded-xl" [class.border-red-400]="errors.fullName"/>
        <span *ngIf="errors.fullName" class="text-red-500 text-xs">{{ errors.fullName }}</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Email *</label>
        <input pInputText  name="email" [(ngModel)]="email" placeholder="Enter your email"
          class="w-full p-3 border rounded-xl" [class.border-red-400]="errors.email"/>
        <span *ngIf="errors.email" class="text-red-500 text-xs">{{ errors.email }}</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">School *</label>
        <p-select
          name="schoolId"
          [options]="schools"
          [(ngModel)]="schoolId"
          optionLabel="name"
          optionValue="id"
          placeholder="Select your school"
          (onChange)="onSchoolChange()"/>

        <span *ngIf="errors.schoolId" class="text-red-500 text-xs">{{ errors.schoolId }}</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Class *</label>
        <p-select
          name="selectedClass"
          [options]="classes"
          [(ngModel)]="selectedClass"
          optionLabel="name"
          optionValue="id"
          placeholder="Select your class"
          [disabled]="!schoolId"/>
        <span *ngIf="errors.selectedClass" class="text-red-500 text-xs">{{ errors.selectedClass }}</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Password *</label>
        <p-password [(ngModel)]="password"  name="password" [feedback]="false" [toggleMask]="true"
          placeholder="Min. 6 characters" styleClass="w-full"
          inputStyleClass="w-full p-3 border rounded-xl"/>
        <span *ngIf="errors.password" class="text-red-500 text-xs">{{ errors.password }}</span>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Confirm Password *</label>
        <p-password [(ngModel)]="confirmPassword" name="confirmPassword" [feedback]="false" [toggleMask]="true"
          placeholder="Re-enter your password" styleClass="w-full"
          inputStyleClass="w-full p-3 border rounded-xl"/>
        <span *ngIf="errors.confirmPassword" class="text-red-500 text-xs">{{ errors.confirmPassword }}</span>
      </div>

      <button pButton
        [label]="loading ? 'Creating Account...' : 'Create Account'"
        type="submit"
        [disabled]="loading"
        class="w-full mt-2 bg-orange-500 border-none"
        >
      </button>

      <p class="text-center text-sm mt-2">
        Already have an account?
        <a routerLink="/login" class="text-orange-500 font-semibold">Login</a>
      </p>

    </form>
  </div>
</div>
