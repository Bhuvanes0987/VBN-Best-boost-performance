<p-toast position="top-right" />
<p-confirmpopup />

<div class="min-h-screen bg-slate-50">
  <div class="h-32 bg-gradient-to-r from-orange-600 to-orange-400 w-full absolute top-0 left-0"></div>

  <div class="relative max-w-5xl mx-auto p-1">

    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-extrabold text-white">Manage Units</h1>
        <p class="text-orange-100 text-sm">Add and manage units per subject</p>
      </div>
      <p-button label="Add Unit" icon="pi pi-plus"
        styleClass="bg-white text-orange-600 border-none shadow"
        (click)="openAdd()"/>
    </div>

    <div class="bg-white rounded-xl shadow p-4 mb-6">
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold text-gray-700">School</label>
          <p-select [options]="schools" [(ngModel)]="selectedSchool"
            optionLabel="name" optionValue="id"
            placeholder="Select School" styleClass="w-full"
            (onChange)="onSchoolChange()"/>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-sm font-semibold text-gray-700">Subject</label>
          <p-select [options]="subjects" [(ngModel)]="selectedSubject"
            optionLabel="subject_name" optionValue="id"
            placeholder="Select Subject" styleClass="w-full"
            [disabled]="!selectedSchool"
            (onChange)="onSubjectChange()"/>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
      <p-table [value]="units" responsiveLayout="scroll" styleClass="p-datatable-hoverable-rows w-full">

        <ng-template pTemplate="header">
          <tr>
            <th>Unit No.</th>
            <th>Unit Name</th>
            <th class="text-center">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-u>
          <tr>
            <td>
              <span class="bg-orange-100 text-orange-600 font-bold px-3 py-1 rounded-full text-sm">
                Unit {{ u.unit_number }}
              </span>
            </td>
            <td class="font-medium">{{ u.unit_name }}</td>
            <td class="text-center">
              <div class="flex justify-center gap-2">
                <p-button icon="pi pi-pencil" [text]="true" severity="secondary"
                  pTooltip="Edit" (click)="editUnit(u)"/>
                <p-button icon="pi pi-trash" [text]="true" severity="danger"
                  pTooltip="Delete" (click)="confirmDelete($event, u.id)"/>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="3" class="text-center py-12">
              <div class="flex flex-col items-center gap-2">
                <i class="pi pi-list text-4xl text-slate-300"></i>
                <p class="text-slate-500 font-medium">No Units Found</p>
                <p class="text-sm text-slate-400">
                  {{ !selectedSubject ? 'Select a school and subject to view units' : 'Click "Add Unit" to create the first unit' }}
                </p>
              </div>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </div>
  </div>

  <p-dialog [header]="editMode ? 'Edit Unit' : 'Add Unit'"
    [(visible)]="showDialog" [modal]="true"
    [style]="{width:'420px'}" [draggable]="false">

    <div class="flex flex-col gap-4 pt-2">

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700">Unit Number</label>
        <p-inputnumber [(ngModel)]="unitNumber" [min]="1" styleClass="w-full"/>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-semibold text-gray-700">Unit Name *</label>
        <input pInputText [(ngModel)]="unitName"
          placeholder="e.g. Introduction to Algebra" class="w-full"/>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <p-button label="Cancel" severity="secondary" (click)="showDialog = false"/>
        <p-button [label]="editMode ? 'Update' : 'Save'"
          styleClass="bg-orange-500 border-none" (click)="saveUnit()"/>
      </div>

    </div>
  </p-dialog>

</div>
