<p-toast position="top-right" />

<div class="p-8">

  <h2 class="text-2xl font-bold text-orange-600 mb-6">User Management</h2>

  <div class="bg-white shadow-lg rounded-xl p-6 mb-8">
    <div class="grid grid-cols-2 gap-6">

      <input pInputText [(ngModel)]="fullName" placeholder="Full Name" />
      <input pInputText [(ngModel)]="email" placeholder="Email" />

      <p-select [options]="schools" [(ngModel)]="selectedSchool"
        optionLabel="name" optionValue="id"
        placeholder="Select School"
        (onChange)="onSchoolChange()">
      </p-select>

      <p-select [options]="roles" [(ngModel)]="selectedRole"
        optionLabel="name" optionValue="id"
        placeholder="Select Role">
      </p-select>

      <p-select [options]="classes" [(ngModel)]="selectedClass"
        optionLabel="name" optionValue="id"
        placeholder="Select Class"
        [disabled]="!selectedSchool"
        (onChange)="onClassChange()">
      </p-select>

      <input pInputText [(ngModel)]="schoolCode"
        placeholder="School Code (auto-filled)"
        [disabled]="true"
        class="bg-gray-50 text-gray-500"/>

      <div class="col-span-2" *ngIf="isTeacherRole()">
        <label class="text-xs text-orange-500 font-bold uppercase tracking-widest block mb-1">
          Subject * <span class="text-gray-400 normal-case font-normal">(required for Teacher)</span>
        </label>
        <p-multiSelect [options]="subjects" [(ngModel)]="selectedSubject"
          optionLabel="subject_name" optionValue="id"
          placeholder="Select Subject(s) for this Teacher"
          [disabled]="!selectedClass"
          styleClass="w-full">
        </p-multiSelect>
      </div>

    </div>

    <div class="flex gap-3 mt-6">
      <button pButton *ngIf="!editingUserId"
        [label]="submitting ? 'Creating...' : 'Create User'"
        class="bg-orange-500 border-none"
        [disabled]="submitting"
        (click)="createUser()">
      </button>
      <button pButton *ngIf="editingUserId"
        [label]="submitting ? 'Updating...' : 'Update User'"
        class="bg-green-500 border-none"
        [disabled]="submitting"
        (click)="updateUser()">
      </button>
      <button pButton *ngIf="editingUserId"
        label="Cancel" class="p-button-text border-none"
        [disabled]="submitting"
        (click)="resetForm()">
      </button>
    </div>
  </div>

  <p-table [value]="users" [paginator]="true" [rows]="10" responsiveLayout="scroll"
    styleClass="p-datatable-striped w-full">

    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="name" class="cursor-pointer select-none">Name <p-sortIcon field="name" /></th>
        <th pSortableColumn="email" class="cursor-pointer select-none">Email <p-sortIcon field="email" /></th>
        <th pSortableColumn="studentClassName" class="cursor-pointer select-none">Class <p-sortIcon field="studentClassName" /></th>
        <th>Role</th>
        <th pSortableColumn="schoolName" class="cursor-pointer select-none">School <p-sortIcon field="schoolName" /></th>
        <th>Actions</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.studentClassName || '-' }}</td>
        <td>
          <span class="px-2 py-1 rounded-full text-xs font-semibold"
            [ngClass]="{
              'bg-red-100 text-red-600':       getRoleName(user) === 'Admin',
              'bg-blue-100 text-blue-600':     getRoleName(user) === 'Student',
              'bg-orange-100 text-orange-600': getRoleName(user) !== 'Admin' && getRoleName(user) !== 'Student' && getRoleName(user) !== '-',
              'bg-gray-100 text-gray-400':     getRoleName(user) === '-'
            }">
            {{ getRoleName(user) }}
          </span>
        </td>
        <td>{{ user.schoolName || '-' }}</td>
        <td>
          <div class="flex gap-2">
            <button pButton icon="pi pi-pencil"
              class="p-button-warning p-button-sm"
              pTooltip="Edit" (click)="editUser(user)">
            </button>
            <button pButton icon="pi pi-trash"
              class="p-button-danger p-button-sm"
              pTooltip="Delete" (click)="confirmDelete($event, user.id)">
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="empty">
      <tr>
        <td colspan="6" class="text-center text-gray-400 py-6">No users found</td>
      </tr>
    </ng-template>

  </p-table>

  <p-confirmpopup />
</div>
