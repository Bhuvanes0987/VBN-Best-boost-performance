<div class="min-h-screen flex flex-col bg-slate-50">
  <nav class="sticky top-0 z-50 flex h-16 items-center justify-between bg-gradient-to-r from-orange-600 via-orange-400 to-orange-600 px-6 shadow-md">
    <span class="text-2xl font-bold text-white tracking-tight cursor-pointer"  (click)="goTo('/home')">QuizElevate</span>

    <div class="flex items-center gap-4">
      <p-button 
        icon="pi pi-cog" 
        [rounded]="true" 
        [text]="true" 
        (onClick)="sidebarVisible.set(true)"
        class="text-white hover:rotate-90 transition-transform duration-300" />
        
      <p-avatar [label]="userInitials()" shape="circle" styleClass="bg-slate-900 text-white" />
    </div>
  </nav>

  <p-drawer [(visible)]="sidebarVisible" position="right" styleClass="w-80 !bg-slate-900 !text-white">
    <ng-template pTemplate="header">
      <span class="font-bold text-xl text-orange-500">Navigation</span>
    </ng-template>
    
    <div class="flex flex-col h-full py-4">
<ul class="flex-1 space-y-2 list-none p-0 m-0">

  <li (click)="goTo('/user')" class="nav-item">
    <i class="pi pi-users"></i>
    <span>Manage Users</span>
  </li>

  <li (click)="goTo('/classes')" class="nav-item">
    <i class="pi pi-sitemap"></i>
    <span>Manage Classes</span>
  </li>

  <li (click)="goTo('/subjects')" class="nav-item">
    <i class="pi pi-book"></i>
    <span>Manage Subjects</span>
  </li>

  <li (click)="goTo('/questions')" class="nav-item">
    <i class="pi pi-question-circle"></i>
    <span>Question Bank</span>
  </li>

  <li (click)="goTo('/import')" class="nav-item">
    <i class="pi pi-upload"></i>
    <span>Import Questions</span>
  </li>

  <li (click)="goTo('/quiz')" class="nav-item">
    <i class="pi pi-play-circle"></i>
    <span>Quizzes</span>
  </li>

  <li (click)="goTo('/results')" class="nav-item">
    <i class="pi pi-chart-bar"></i>
    <span>Results</span>
  </li>

  <li (click)="goTo('/instructions')" class="nav-item">
    <i class="pi pi-info-circle"></i>
    <span>Instructions</span>
  </li>

  <li (click)="goTo('/payments')" class="nav-item">
    <i class="pi pi-credit-card"></i>
    <span>Payments</span>
  </li>

</ul>      <div class="mt-auto p-4 bg-slate-800/50 rounded-xl border border-slate-700">
        <div class="flex items-center gap-3">
          <p-avatar [label]="userInitials()" shape="circle" />
          <span class="text-sm font-medium">Alex Bennett</span>
        </div>
      </div>
    </div>
  </p-drawer>

  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <footer class="h-20 bg-slate-100 flex items-center justify-center border-t border-slate-200">
    <span class="text-xs font-bold text-slate-400 tracking-[0.3em] uppercase">Advertisement Space</span>
  </footer>
</div>
