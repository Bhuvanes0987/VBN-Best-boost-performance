<div class="min-h-screen flex flex-col bg-slate-50">
  <p-drawer [(visible)]="sidebarVisible" position="right" styleClass="w-80 !bg-slate-900 !text-white">
    <ng-template pTemplate="header">
      <span class="font-bold text-xl text-orange-500">Navigation</span>
    </ng-template>

    <div class="flex flex-col h-full py-4">
      <ul class="flex-1 space-y-2 list-none p-0 m-0">
        <li (click)="goTo('/user')" class="nav-item group">
          <i class="pi pi-home"></i> <span>user</span>
        </li>
        <li (click)="goTo('/instructions')" class="nav-item group">
          <i class="pi pi-book"></i> <span>Instructions</span>
        </li>
        <li (click)="goTo('/payments')" class="nav-item group">
          <i class="pi pi-credit-card"></i> <span>Payments</span>
        </li>
        <li (click)="goTo('/contact-us')" class="nav-item group">
          <i class="pi pi-envelope"></i> <span>Contact Us</span>
        </li>
      </ul>

      <div class="mt-auto p-4 bg-slate-800/50 rounded-xl border border-slate-700">
        <p class="text-xs text-slate-400 uppercase font-bold tracking-widest">User Profile</p>
        <div class="flex items-center gap-3 mt-3">
          <p-avatar [label]="userInitials()" shape="circle" />
          <span class="text-sm font-medium">Alex Bennett</span>
        </div>
      </div>
    </div>
  </p-drawer>

  <main class="flex-1 flex flex-col md:flex-row items-center justify-between px-10 lg:px-24 py-12 gap-12">

    <div class="flex-1 max-w-2xl animate-fadein">
      <h1 class="text-6xl lg:text-8xl font-black text-slate-900 leading-[0.9]">
        Master <br>
        <span class="text-orange-500 italic">Every</span> Quiz.
      </h1>
      <p class="mt-8 text-xl text-slate-600 leading-relaxed">
        Challenge yourself with timed assessments, track your progress, and climb the global leaderboard.
      </p>

      <div class="mt-10 flex gap-4">
        <p-button label="Start Quiz" size="large" (click)="openQuizDialog()"
          styleClass="bg-slate-900 border-none hover:bg-orange-500 px-10 py-5 text-lg font-bold transition-all">
        </p-button>
      </div>
    </div>

    <div
      class="hidden lg:block w-72 h-[450px] bg-white rounded-[2rem] shadow-2xl border border-slate-100 p-6 animate-float relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-orange-50 to-transparent opacity-50"></div>
      <div class="relative z-10 h-full flex flex-col items-center justify-center text-center">
        <div class="w-16 h-16 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mb-4">
          <i class="pi pi-bolt text-2xl"></i>
        </div>
        <p class="font-bold text-slate-800">Go Premium</p>
        <p class="text-sm text-slate-500 mt-2">Get ad-free quizzes and detailed analytics.</p>
        <button class="mt-6 text-xs font-bold uppercase tracking-tighter text-orange-600 underline">Learn More</button>
      </div>
    </div>
  </main>

</div>

<p-dialog header="Start Quiz" [(visible)]="dialogVisible" [modal]="true" [style]="{width:'400px'}">

  <div class="flex flex-col gap-4">

    <label class="font-semibold">Select Class</label>

    <p-select [options]="classes" optionLabel="class_name" [(ngModel)]="selectedClass" (onChange)="onClassChange()"
      placeholder="Select Class">
    </p-select>


    <label class="font-semibold">Select Subject</label>

    <p-select [options]="subjects" optionLabel="subject_name" [(ngModel)]="selectedSubject"
      placeholder="Select Subject">
    </p-select>


    <div class="flex justify-end gap-3 mt-4">

      <p-button label="Cancel" severity="secondary" (click)="dialogVisible=false">
      </p-button>

      <p-button label="Start Quiz" styleClass="bg-orange-500 border-none" (click)="startQuiz()">
      </p-button>

    </div>

  </div>

</p-dialog>
