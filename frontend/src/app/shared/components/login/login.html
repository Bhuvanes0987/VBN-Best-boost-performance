<div class="min-h-screen flex bg-white">
  <div class="hidden lg:flex w-1/2 relative items-center justify-center 
              bg-gradient-to-br from-orange-500 via-orange-600 to-amber-500 p-20">

    <div class="absolute w-[400px] h-[400px] bg-white/20 rounded-full blur-[120px] top-[-100px] left-[-100px]"></div>

    <div class="relative z-10 text-white text-center">
      <h1 class="text-6xl font-extrabold tracking-tight mb-6">
        Quiz
      </h1>

      <p class="text-lg opacity-90 mb-8 max-w-md">
        Challenge your knowledge, climb the leaderboard and win exciting prizes.
      </p>

    </div>

  </div>

  <div class="flex-1 flex items-center justify-center p-8">

<div
 class="w-full max-w-md bg-white border-2 border-orange-500
        rounded-3xl shadow-xl p-10">

  <div class="text-center mb-10">
    <h2 class="text-3xl font-bold text-gray-800 mb-2">
      Welcome Back
    </h2>

    <p class="text-gray-500 text-sm">
      Log in to continue
    </p>
  </div>

      <div class="flex flex-col gap-6">

        <div class="flex flex-col gap-2">
          <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">
            Email
          </label>

          <input
            pInputText
            [(ngModel)]="email"
            placeholder="Enter your email"
            class="w-full p-4 bg-white text-gray-800 rounded-xl border border-gray-700 
                   focus:ring-2 focus:ring-orange-500 outline-none"
          />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">
            Password
          </label>

          <p-password
            [(ngModel)]="password"
            [feedback]="false"
            [toggleMask]="true"
            styleClass="w-full"
            inputStyleClass="w-full p-4 bg-white text-gray-800   rounded-xl border border-gray-700 focus:ring-2 focus:ring-orange-500"
            placeholder="Enter your password">
          </p-password>
        </div>
        <div class="text-right">
        <a routerLink="/forgot-password"
          class="text-sm text-orange-400 hover:text-orange-300">
          Forgot Password?
        </a>
      </div>

        <button
          (click)="login()"
          class="w-full py-4 bg-gradient-to-r from-orange-500 to-orange-600 
                 hover:from-orange-600 hover:to-orange-700 
                 text-white font-bold text-lg rounded-xl shadow-lg 
                 transition transform hover:scale-[1.02] active:scale-95">

          Start Playing
        </button>

        <p class="text-center text-gray-400 text-sm">
          Don't have an account?
          <a routerLink="/signup" class="text-orange-400 hover:text-orange-300 ml-1">
            Sign Up
          </a>
        </p>

      </div>

    </div>

  </div>

</div>
