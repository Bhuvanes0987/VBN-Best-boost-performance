<div class="p-10 max-w-3xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">
        Quiz
    </h1>


    <div *ngIf="!quizFinished && questions.length">

        <h2 class="text-lg font-semibold mb-4">
            Question {{currentIndex+1}} / {{questions.length}}
        </h2>

        <p class="text-xl mb-6">
            {{questions[currentIndex].question_text}}
        </p>



        <div *ngIf="questions[currentIndex].question_type === 'mcq'">

            <div *ngFor="let opt of questions[currentIndex].answer_data.options; let i=index"
                class="flex items-center gap-3 mb-3">

                <p-radioButton name="answer" [value]="i" [(ngModel)]="answers[currentIndex]">
                </p-radioButton>

                <span>{{opt}}</span>

            </div>

        </div>




        <div *ngIf="questions[currentIndex].question_type === 'fill'">

            <input pInputText [(ngModel)]="answers[currentIndex]" placeholder="Type your answer" class="w-full">

        </div>




        <div *ngIf="questions[currentIndex].question_type === 'match'">

            <div *ngFor="let pair of questions[currentIndex].answer_data.pairs" class="mb-2">

                {{pair.left}} → {{pair.right}}

            </div>

        </div>



        <div class="flex justify-between mt-8">

            <p-button label="Previous" (click)="prevQuestion()" [disabled]="currentIndex===0">
            </p-button>


            <p-button label="Next" (click)="nextQuestion()" *ngIf="currentIndex < questions.length-1">
            </p-button>


            <p-button label="Submit Quiz" styleClass="bg-green-500 border-none" (click)="submitQuiz()"
                *ngIf="currentIndex === questions.length-1">
            </p-button>

        </div>

    </div>




    <div *ngIf="quizFinished" class="text-center mt-10">

        <h2 class="text-3xl font-bold text-green-600">
            Quiz Completed
        </h2>

        <p class="text-xl mt-4">
            Your Score
        </p>

        <p class="text-5xl font-black text-orange-500 mt-4">
            {{score}} / {{questions.length}}
        </p>

    </div>

</div>
