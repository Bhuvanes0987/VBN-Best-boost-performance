<p-toast position="top-right" />

<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-10 border-2 border-orange-500">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800 mb-2">Reset Password</h2>
      <p class="text-gray-500 text-sm">Enter your new password below</p>
    </div>

    <div *ngIf="done" class="text-center py-6">
      <i class="pi pi-check-circle text-green-500 text-5xl mb-4 block"></i>
      <p class="text-gray-700 font-medium mb-2">Password reset successfully!</p>
      <p class="text-gray-500 text-sm">Redirecting to login...</p>
    </div>

    <div *ngIf="!done" class="flex flex-col gap-6">

      <div class="flex flex-col gap-2">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">New Password</label>
        <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true"
          placeholder="Min. 6 characters" styleClass="w-full"
          inputStyleClass="w-full p-4 rounded-xl border border-gray-300"/>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs text-orange-400 uppercase font-bold tracking-widest">Confirm Password</label>
        <p-password [(ngModel)]="confirmPassword" [feedback]="false" [toggleMask]="true"
          placeholder="Re-enter password" styleClass="w-full"
          inputStyleClass="w-full p-4 rounded-xl border border-gray-300"/>
      </div>

      <button (click)="submit()" [disabled]="loading"
        class="w-full py-4 bg-gradient-to-r from-orange-500 to-orange-600
               hover:from-orange-600 hover:to-orange-700
               text-white font-bold text-lg rounded-xl shadow-lg
               transition transform hover:scale-[1.02] active:scale-95 disabled:opacity-60">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>

    </div>
  </div>
</div>
