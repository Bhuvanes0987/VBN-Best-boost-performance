<div class="p-8">

<h2 class="text-2xl font-bold mb-6 text-orange-600">
Role Management
</h2>

<div class="bg-white shadow-lg rounded-xl p-6 mb-8">

<div class="grid grid-cols-2 gap-6">

<input
pInputText
[(ngModel)]="roleName"
placeholder="Role Name"
class="p-3 border rounded-lg"
/>

<input
pInputText
[(ngModel)]="description"
placeholder="Description"
class="p-3 border rounded-lg"
/>

</div>

<div class="mt-6">

<p-multiSelect
[options]="permissions"
[(ngModel)]="selectedPermissions"
optionLabel="name"
placeholder="Select Permissions"
class="w-full">
</p-multiSelect>

</div>

<button
pButton
label="Create Role"
class="mt-6 bg-orange-500 border-none"
(click)="createRole()">
</button>

</div>

<p-table [value]="roles">

<ng-template pTemplate="header">
<tr>
<th>Role</th>
<th>Description</th>
</tr>
</ng-template>

<ng-template pTemplate="body" let-role>
<tr>
<td>{{role.name}}</td>
<td>{{role.description}}</td>
</tr>
</ng-template>

</p-table>

</div>
