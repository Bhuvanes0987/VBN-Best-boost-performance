<div class="p-8">

<h2 class="text-2xl font-bold mb-6 text-orange-600">
Role Management
</h2>

<!-- Create Role Card -->

<div class="bg-white shadow-lg rounded-xl p-6 mb-8">

<div class="grid grid-cols-2 gap-6">

<input
pInputText
[(ngModel)]="roleName"
placeholder="Role Name"
class="p-3 border rounded-lg w-full"
/>

<input
pInputText
[(ngModel)]="description"
placeholder="Description"
class="p-3 border rounded-lg w-full"
/>

</div>

<div class="mt-6">

<p-multiSelect
[options]="permissions"
[(ngModel)]="selectedPermissions"
optionLabel="name"
placeholder="Select Permissions"
class="w-full">
</p-multiSelect>

</div>

<button
pButton
label="Create Role"
class="mt-6 bg-orange-500 border-none"
(click)="createRole()">
</button>

</div>

<!-- Roles Table -->

<p-table [value]="roles" class="shadow-md rounded-lg">

<ng-template pTemplate="header">
<tr>
<th class="text-left">Role</th>
<th class="text-left">Description</th>
<th class="text-left">Permissions</th>
</tr>
</ng-template>

<ng-template pTemplate="body" let-role>
<tr>

<td class="font-medium">
{{role.name}}
</td>

<td>
{{role.description || '-'}}
</td>

<td>
<span *ngIf="role.permissions?.length; else noPerm">
{{role.permissions.join(', ')}}
</span>

<ng-template #noPerm>
-
</ng-template>
</td>

</tr>
</ng-template>

</p-table>

</div>
