<div class="min-h-screen bg-slate-50">

    <div class="h-32 bg-gradient-to-r from-orange-600 to-orange-400 w-full absolute top-0 left-0"></div>

    <div class="relative max-w-6xl mx-auto p-10">

        <div class="mb-8">

            <h1 class="text-3xl font-extrabold text-white">
                Manage Subjects
            </h1>

            <p class="text-orange-100 text-sm">
                Create and manage subjects
            </p>

        </div>

        <div class="bg-white rounded-xl shadow border border-slate-200 p-6 mb-6">

            <div class="grid grid-cols-3 gap-4 items-start">

                <div class="flex flex-col gap-1">

                    <p-multiSelect [options]="classes" optionLabel="class_name" [(ngModel)]="selectedClasses"
                        placeholder="Select Classes" display="chip" class="w-full"
                        [ngClass]="{'ng-invalid ng-dirty border-red-500': submitted && selectedClasses.length===0}">
                    </p-multiSelect>

                    <small *ngIf="submitted && selectedClasses.length===0" class="text-red-500 text-xs">
                        Class is required
                    </small>

                </div>


                <div class="flex flex-col gap-1">

                    <input pInputText [(ngModel)]="subjectName" placeholder="Subject Name" class="w-full"
                        [ngClass]="{'border-red-500': submitted && !subjectName}" />

                    <small *ngIf="submitted && !subjectName" class="text-red-500 text-xs">
                        Subject name is required
                    </small>

                </div>


                <div class="flex gap-3">

                    <p-button label="{{editMode ? 'Update' : 'Add'}}" (click)="addSubject()"
                        styleClass="bg-orange-500 border-none w-full">
                    </p-button>

                    <p-button *ngIf="editMode" label="Cancel" severity="secondary" (click)="resetForm()"
                        styleClass="w-full">
                    </p-button>

                </div>

            </div>

        </div>


        <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">

            <p-table [value]="subjects" styleClass="p-datatable-hoverable-rows">

                <ng-template pTemplate="header">

                    <tr>
                        <th>ID</th>
                        <th>Subject</th>
                        <th>Classes</th>
                        <th class="text-center">Actions</th>
                    </tr>

                </ng-template>

                <ng-template pTemplate="body" let-s>

                    <tr>

                        <td>{{s.id}}</td>

                        <td>{{s.subject_name}}</td>

                        <td>

                            <span *ngFor="let c of s.classes"
                                class="bg-orange-100 text-orange-700 px-2 py-1 rounded text-xs mr-1">

                                {{c.class_name}}

                            </span>

                        </td>

                        <td class="text-center space-x-2">

                            <p-button icon="pi pi-pencil" [text]="true" (click)="editSubject(s)">
                            </p-button>

                            <p-button icon="pi pi-trash" [text]="true" severity="danger" (click)="deleteSubject(s.id)">
                            </p-button>

                        </td>

                    </tr>

                </ng-template>

            </p-table>

        </div>

    </div>

</div>
