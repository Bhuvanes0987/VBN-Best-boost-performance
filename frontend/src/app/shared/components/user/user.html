<div class="p-8">

<h2 class="text-2xl font-bold text-orange-600 mb-6">
User Management
</h2>

<div class="bg-white shadow-lg rounded-xl p-6 mb-8">

<div class="grid grid-cols-2 gap-6">

<input
pInputText
[(ngModel)]="fullName"
placeholder="Full Name"
class="p-3 border rounded-lg"
/>

<input
pInputText
[(ngModel)]="email"
placeholder="Email"
class="p-3 border rounded-lg"
/>

<p-select
[options]="classes"
[(ngModel)]="selectedClass"
optionLabel="label"
placeholder="Select Class">
</p-select>

<p-select
[options]="roles"
[(ngModel)]="selectedRole"
optionLabel="name"
placeholder="Select Role">
</p-select>

<input
pInputText
[(ngModel)]="schoolName"
placeholder="School Name"
class="p-3 border rounded-lg"
/>

<input
pInputText
[(ngModel)]="schoolCode"
placeholder="School Code"
class="p-3 border rounded-lg"
/>

</div>

<button
pButton
label="Create User"
class="mt-6 bg-orange-500 border-none"
(click)="createUser()">
</button>

</div>

<p-table [value]="users">

<ng-template pTemplate="header">
<tr>
<th>Name</th>
<th>Email</th>
<th>Class</th>
<th>School</th>
</tr>
</ng-template>

<ng-template pTemplate="body" let-user>
<tr>
<td>{{user.name}}</td>
<td>{{user.email}}</td>
<td>{{user.studentClass}}</td>
<td>{{user.schoolName}}</td>
</tr>
</ng-template>

</p-table>

</div>
